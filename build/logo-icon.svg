<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f766e"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="400" height="400" rx="80" ry="80" fill="url(#bg)"/>
  <!-- Tree icon (simplified pine/evergreen) -->
  <g transform="translate(200, 185)" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top triangle -->
    <path d="M0,-95 L-55,-20 L-30,-20 L-75,55 L-25,55 L-60,120 L60,120 L25,55 L75,55 L30,-20 L55,-20 Z"/>
    <!-- Trunk -->
    <line x1="-20" y1="120" x2="-20" y2="155"/>
    <line x1="20" y1="120" x2="20" y2="155"/>
  </g>
</svg>
